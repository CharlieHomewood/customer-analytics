[project]
name = "customer-analytics"
version = "0.1.0"
requires-python = ">= 3.12.12"
dependencies = [
    "db-dtypes>=1.7.2",
    "google-cloud-bigquery>=3.46.1",
    "ipywidgets>=8.1.9",
    "kagglehub>=1.0.2",
    "matplotlib>=3.11.2",
    "optuna>=5.0.0",
    "pandas>=3.0.6",
    "psycopg[binary]>=3.3.6",
    "pyjanitor>=0.32.40",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
    "sqlalchemy>=2.1.4",
    "xgboost>=3.4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/customer_analytics"]
